# LLM tiers (DESIGN.md §5, §22). Model IDs must come from the NanoGPT subscription list
# (GET https://nano-gpt.com/api/subscription/v1/models). `auto` picks from that list (§22.3):
# first from config/model-bench.json (written by `pnpm bench-models`), otherwise by heuristics.
# Timeouts from live runs with five agents: replies have a long tail (L1 p90 3.8 s, some past 5 s; L2 p90 3.3 s,
# some past 6 s), and a timed-out try costs a whole second try on the next model. L2's tokens leave a thinking model
# room to think before it answers (2026-10-25: glm-5.3 thinks unseen, and its thinking counts; at 900 a tangled
# situation came back "{}" three times of three and the mind fell to the next model or the code; at 3000, four of four
# answered, 280-430 tokens of reply seen). It is a ceiling: a model that is done stops.
tiers:
  L1: { primary: auto, fallbacks: [auto], timeoutMs: 7000, maxTokens: 200, need: [structured_output] }
  L2: { primary: auto, fallbacks: [auto], timeoutMs: 8000, maxTokens: 2500, need: [structured_output, tool_calling] }
  L3: { primary: auto, fallbacks: [auto], timeoutMs: 45000, maxTokens: 2000, need: [structured_output] }

# The tier agents' lines are written with, and the models tried first for them. L1 models are quick but small ones
# cut lines short or miss the timeout. Talk drives how the agents deal with each other, so a line gets a stronger
# model and up to 8 s a try (owner request, 2026-10-24). Measured with the real speech prompt (8 lines each, DESIGN.md
# §24): glm-5.1 wrote the clearest lines in the most natural player style (p50 1.6 s, p90 2.1 s); kimi-k2.6 and
# mimo-v2.6-pro were close; minimax-m3 (L2's first by heuristics) was plainer. Measured again on 2026-10-25, glm-5.1
# now writes out its working before the line ("Bram asked "so whos on wood?" I need to answer as Mira — ... at most
# 25 words"), three times of three, and a duo's chat filled with it; kimi-k2.6 (1.7-2.6 s) and minimax-m3 (about
# 1 s) wrote only the line; mimo-v2.6-pro did too, once taking 20 s. A model not on the subscription list is skipped;
# after these, the tier's own chain.
speech:
  tier: L2
  models: [moonshotai/kimi-k2.6, minimax/minimax-m3, xiaomi/mimo-v2.6-pro]
  timeoutMs: 8000

# §22.5: local by default (all-MiniLM-L6-v2, served once by the Hub). nanogpt only if subscription-covered.
embeddings: { provider: local }

llm:
  baseUrl: subscription            # fixed; 'paid' requires allowPaidKey
  allowPaidKey: false              # refuse to start if the key can spend balance (§22.1)
  expectedRuntimeHoursPerWeek: 30  # for quota allocation (§22.4)
  allowlistRefreshHours: 6
  usagePollSec: 300
  structuredOutput: object         # object: JSON reply, schema in the prompt | schema: the API's json_schema format

# The mind (owner request, 2026-10-24): each decision is thought through (what is going on, what surprised, the ways
# there, the choice), a longer reply than a bare choice. Measured with the real thinking prompt on three situations
# (the sheep gone and wool still wanted, someone hanging in the air, the first minutes with seven tasks): glm-5.3
# thought clearest and quickest (3.5-6 s), sheared rather than killed and asked the flyer how; minimax-m3 (L2's first
# by heuristics) was as quick (3-5 s) but timed out at 8 s four times in a live run; kimi-k2.6 and glm-5.1 were good at
# 5-10 s; deepseek-v4-pro good but 7-9 s; mimo-v2.6-pro took 26-52 s or failed. After these, the CC's tier chain.
mind:
  models: [z-ai/glm-5.3, minimax/minimax-m3, moonshotai/kimi-k2.6, z-ai/glm-5.1]
  timeoutMs: 15000

# The architect (owner request, 2026-10-24): called only when an agent designs a building, so a strong model and time
# to think. Measured with the real architect prompt (four buildings each: a home, a smithy, a tower, a hall): glm-5.3
# drew all four first time in 7-12 s, buildable and good to look at; deepseek-v4-pro and glm-5.1 needed a second try
# for some; kimi-k2.6 and qwen3.5-397b often drew what couldn't be built. A model not on the subscription list is
# skipped; after these, the L3 chain.
architect:
  models: [z-ai/glm-5.3, z-ai/glm-5.1, deepseek/deepseek-v4-pro]
  timeoutMs: 90000

# The controller (owner request, 2026-10-24): one master model over all the agents. Code finds what looks wrong (a
# talk going round in circles, someone standing stuck, the same failure over and over, a mind that won't settle); the
# model judges each case (most are let be) and words the urge that ends it, which the agent takes as its own. Rare
# calls, so a strong model; at most maxPerHour urges an hour. Measured with the real prompt on five cases (a talk
# going round in circles, a long talk that keeps moving on, a craft failing five times, a walk stuck in place, a busy
# talk full of "ok"s): glm-5.3 judged all of them right every time (6 of 6 let the long talk be; 4-22 s); kimi-k2.6 was
# quicker (2-6 s) but broke up the long talk once in 4; deepseek-v4-pro broke it up every time; glm-5.1 once answered
# "...". A model not on the subscription list is skipped; after these, the L3 chain.
controller:
  enabled: true
  models: [z-ai/glm-5.3, moonshotai/kimi-k2.6]
  timeoutMs: 45000
  everySec: 20
  maxPerHour: 20
