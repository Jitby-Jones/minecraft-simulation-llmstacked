# LLM tiers (DESIGN.md §5, §22). Model IDs must come from the NanoGPT subscription list
# (GET https://nano-gpt.com/api/subscription/v1/models). `auto` picks from that list (§22.3):
# first from config/model-bench.json (written by `pnpm bench-models`), otherwise by heuristics.
# Timeouts from live runs with five agents: replies have a long tail (L1 p90 3.8 s, some past 5 s; L2 p90 3.3 s,
# some past 6 s), and a timed-out try costs a whole second try on the next model. L2's tokens leave a thinking model
# room to think before it answers (2026-10-25: glm-5.3 thinks unseen, and its thinking counts; at 900 a tangled
# situation came back "{}" three times of three and the mind fell to the next model or the code; at 3000, four of four
# answered, 280-430 tokens of reply seen). It is a ceiling: a model that is done stops.
tiers:
  L1: { primary: auto, fallbacks: [auto], timeoutMs: 7000, maxTokens: 200, need: [structured_output] }
  L2: { primary: auto, fallbacks: [auto], timeoutMs: 8000, maxTokens: 2500, need: [structured_output, tool_calling] }
  L3: { primary: auto, fallbacks: [auto], timeoutMs: 45000, maxTokens: 2000, need: [structured_output] }

# Each kind of thought on one model of its own (owner request, 2026-10-25: "I don't think models should vary. L1, L2,
# L3 should be chosen by you."), with its reasoning effort, reply cap and time. The backup runs only while the model is
# down (a timeout, a provider error, its circuit open), never for a malformed reply. Cost is not a criterion ("I'm not
# trying to save any tokens"): a smaller model is used only where a big one can't answer in time, and a reply cap only
# to keep a thought fast. Every model here must be on the subscription list, or startup stops. Provisional choices,
# from the measurements below, until `pnpm bench-thoughts` confirms or replaces them (docs/plan-thinking-models.md):
# - mind, social, under fire: glm-5.3 thought clearest in every careful test (the sheep sheared rather than killed,
#   the flyer asked how; 3.5-6 s on three situations, 2026-10-24). Its trouble in the long runs was hidden thinking
#   (10-25 s; at 900 tokens "{}" three times of three) and, from 85% of the old quota, the 200-token L1 cap. Effort
#   none turns the hidden thinking off; the mind thinks in the open, in its `thought`. Backup: deepseek-v4-pro, good but
#   7-9 s (2026-10-24), no hidden thinking. Under fire the same mind with a short reply; its backup a fast model.
# - speech: kimi-k2.6 wrote only the line, in a player's way, in 1.7-2.6 s (2026-10-25); glm-5.1 wrote out its working
#   before the line three times of three; minimax-m3 (about 1 s) wrote only the line, plainer.
# - check: yes/no and a few words in the way of what the agent does next; llama-3.3-70b and gemma-4-12b timed out at
#   7 s 25 times in the 2026-10-25 runs. deepseek-v4-flash, untimed yet.
# - plan, reflect, code: glm-5.3 with its thinking on: nothing waits on them.
# - build: four buildings each (a home, a smithy, a tower, a hall): glm-5.3 drew all four first time in 7-12 s,
#   buildable and good to look at; deepseek-v4-pro and glm-5.1 needed a second try for some; kimi-k2.6 and qwen3.5-397b
#   often drew what couldn't be built (2026-10-24).
# - oversee: five cases (a talk going round in circles, a long talk that keeps moving on, a craft failing five times, a
#   walk stuck in place, a busy talk full of "ok"s): glm-5.3 judged all right every time (4-22 s); kimi-k2.6 was quicker
#   (2-6 s) but broke up the long talk once in 4 (2026-10-24).
# - persona: kimi-k2.6, the agents' voice.
thoughts:
  mind:      { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-pro, effort: none, maxTokens: 1200, timeoutMs: 12000 }
  underFire: { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-flash, effort: none, maxTokens: 600, timeoutMs: 5000 }
  speech:    { model: moonshotai/kimi-k2.6, backup: minimax/minimax-m3, maxTokens: 300, timeoutMs: 8000 }
  social:    { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-pro, effort: none, maxTokens: 800, timeoutMs: 10000 }
  check:     { model: deepseek/deepseek-v4-flash, backup: xiaomi/mimo-v2.6-flash, effort: none, maxTokens: 200, timeoutMs: 4000 }
  plan:      { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-pro, effort: medium, maxTokens: 4000, timeoutMs: 60000 }
  reflect:   { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-pro, effort: medium, maxTokens: 2500, timeoutMs: 60000 }
  build:     { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-pro, effort: medium, maxTokens: 4000, timeoutMs: 90000 }
  code:      { model: z-ai/glm-5.3, backup: deepseek/deepseek-v4-pro, effort: high, maxTokens: 4000, timeoutMs: 90000 }
  oversee:   { model: z-ai/glm-5.3, backup: moonshotai/kimi-k2.6, effort: medium, maxTokens: 1500, timeoutMs: 45000 }
  persona:   { model: moonshotai/kimi-k2.6, backup: z-ai/glm-5.3, maxTokens: 1500, timeoutMs: 45000 }

# §22.5: local by default (all-MiniLM-L6-v2, served once by the Hub). nanogpt only if subscription-covered.
embeddings: { provider: local }

llm:
  baseUrl: subscription            # fixed; 'paid' requires allowPaidKey
  allowPaidKey: false              # refuse to start if the key can spend balance (§22.1)
  allowlistRefreshHours: 6
  usagePollSec: 300               # how often the quota is read for the dashboard; it never limits thinking
  structuredOutput: object         # object: JSON reply, schema in the prompt | schema: the API's json_schema format

# The controller (owner request, 2026-10-24): one master model over all the agents. Code finds what looks wrong (a
# talk going round in circles, someone standing stuck, the same failure over and over, a mind that won't settle); the
# model judges each case (most are let be) and words the urge that ends it, which the agent takes as its own. Rare
# calls, so a strong model; at most maxPerHour urges an hour. Measured with the real prompt on five cases (a talk
# going round in circles, a long talk that keeps moving on, a craft failing five times, a walk stuck in place, a busy
# talk full of "ok"s): glm-5.3 judged all of them right every time (6 of 6 let the long talk be; 4-22 s); kimi-k2.6 was
# quicker (2-6 s) but broke up the long talk once in 4; deepseek-v4-pro broke it up every time; glm-5.1 once answered
# "...". Its model is `thoughts.oversee`.
controller:
  enabled: true
  everySec: 20
  maxPerHour: 20
